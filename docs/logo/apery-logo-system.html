    background: #111119;

    font-family: -apple-system, sans-serif;
    padding: 48px 32px;

  h1 {

    gap: 24px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 56px;
  }

  .panel {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 16px;

  .panel.dark { background: #1a1a2e; }
  .panel.light { background: #f5f3ee; }
  .panel.brand { background: #D4873B; }
  .panel.sm { padding: 32px 40px; }

  .size-row {
    display: flex;
    gap: 32px;
    align-items: flex-end;
    justify-content: center;
    margin-bottom: 56px;
  }
  .size-item { text-align: center; }
  .size-item span { display: block; color: #52525b; font-size: 10px; margin-top: 8px; letter-spacing: 1px; }

  .divider {

<h1>Apery</h1>
<p class="sub">Logo System — Negative Space Gorilla</p>

<!--
  DESIGN: Solid dark gorilla head shape (rounded trapezoid, wider at jaw).
  Face features are negative space (background color showing through).
  - Eye band: horizontal bar across mid-face with two round eyes cut out
  - Muzzle: rounded rect at bottom with nostrils + subtle smile
  - Ears: small bumps on sides of head
  One shape + negative space = works at any size, any single color.
-->

<!-- Reusable SVG def for the gorilla icon -->
<!-- viewBox designed at 80x80 base -->

<!-- PRIMARY LOCKUP -->
<p class="section-label">Primary Lockup</p>
<div class="row">
  <!-- White on dark -->
  <div class="panel dark">
    <svg width="280" height="80" viewBox="0 0 280 80">
      <g transform="translate(4, 4)">
        <!-- Head shape: rounded trapezoid, narrower at top -->

          M18,8
          Q18,0 28,0
          L48,0
          Q58,0 58,8
          L60,16
          Q66,16 68,22
          Q70,28 68,32
          Q66,36 62,34
          L62,46
          Q62,64 50,70
          Q42,76 38,76
          Q34,76 26,70
          Q14,64 14,46
          L14,34
          Q10,36 8,32
          Q6,28 8,22
          Q10,16 16,16
          Z
        " fill="white"/>

        <!-- Eye band - horizontal mask across face -->
        <rect x="16" y="22" width="44" height="16" rx="8" fill="#1a1a2e"/>
        <!-- Eyes - circles cut back to white -->
        <circle cx="28" cy="30" r="5.5" fill="white"/>
        <circle cx="48" cy="30" r="5.5" fill="white"/>
        <!-- Pupils -->
        <circle cx="29.5" cy="30" r="2.8" fill="#1a1a2e"/>
        <circle cx="49.5" cy="30" r="2.8" fill="#1a1a2e"/>

        <!-- Muzzle area -->

        <!-- Nostrils -->
        <circle cx="33" cy="52" r="2.5" fill="white"/>
        <circle cx="43" cy="52" r="2.5" fill="white"/>
        <!-- Smile -->
        <path d="M30,58 Q38,64 46,58" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>

      <text x="88" y="52" font-family="'Space Grotesk', sans-serif" font-size="38" font-weight="700" fill="white" letter-spacing="-0.5">apery</text>

  </div>
